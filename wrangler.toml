name = "kostos-app"
main = "worker/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# no second public origin: the Worker is reachable on its custom domain only
workers_dev = false
preview_urls = false

routes = [
	{ pattern = "kostos.app", custom_domain = true }
]

[assets]
directory = "build"
binding = "ASSETS"
# We handle SPA fallback in worker/index.ts so unknown paths fall through to
# `200.html` (the SvelteKit static shell) rather than `index.html` (the
# prerendered landing, whose hydration data pins it to the `/` route).
not_found_handling = "none"

[[durable_objects.bindings]]
name = "SYNC_ROOM"
class_name = "SyncRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncRoom"]

[observability]
enabled = true

# invocation logs would retain the Sec-WebSocket-Protocol header, which carries the proof
[observability.logs]
invocation_logs = false
