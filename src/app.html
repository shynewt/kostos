<!doctype html>
<html lang="en" data-theme="dark" data-palette="lime">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0a0c0a" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f7f6f1" media="(prefers-color-scheme: light)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Kostos" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon-180x180.png" />
		<script>
			// Apply persisted theme/palette before first paint to avoid flash.
			// Stored value may be 'light' | 'dark' | 'system' (or absent = system).
			(function () {
				var r = document.documentElement;
				var stored = null;
				var palette = null;
				try {
					stored = localStorage.getItem('kostos:theme');
					palette = localStorage.getItem('kostos:palette');
				} catch (_) {}
				var mql = window.matchMedia('(prefers-color-scheme: light)');
				function resolve() {
					if (stored === 'light' || stored === 'dark') return stored;
					return mql.matches ? 'light' : 'dark';
				}
				function apply() {
					r.setAttribute('data-theme', resolve());
				}
				apply();
				if (palette) r.setAttribute('data-palette', palette);
				if (mql.addEventListener) mql.addEventListener('change', apply);
				else if (mql.addListener) mql.addListener(apply);
				window.__kostosApplyTheme = function (next) {
					stored = next === 'light' || next === 'dark' ? next : null;
					apply();
				};
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
