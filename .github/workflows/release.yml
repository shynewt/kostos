name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy to Cloudflare
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kostos.app
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Refuse to ship placeholders
        run: |
          test -f wrangler.toml
          # built in two pieces so the repo-wide replace that picks the real domain can't rewrite
          # this check into one that matches the finished config and refuses every release
          placeholder="APP_""DOMAIN"
          if grep -n "$placeholder" wrangler.toml || grep -nE "^ +url: https://$placeholder" .github/workflows/release.yml; then
            echo "Replace $placeholder in wrangler.toml and the environment url of this workflow first"
            exit 1
          fi

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build static bundle
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
